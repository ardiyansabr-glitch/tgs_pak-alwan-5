
name: Compile C++ to EXE

on:
  workflow_dispatch:
  push:
    paths:
      - '**.cpp'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MinGW
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc

      - name: Compile C++
        shell: msys2 {0}
        run: g++ main.cpp -o main.exe -std=c++17 -O2 -static

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: hasil-exe
          path: main.exe
